name: Bugby-Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bugby
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/bugby?sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24

      - name: Tidy modules
        run: go mod tidy

      - name: Check go mod tidy state
        run: git diff --exit-code go.mod go.sum

      - name: Download modules
        run: go mod download

      - name: Ensure test deps (sqlmock) available
        run: |
          go get github.com/DATA-DOG/go-sqlmock@v1.5.2 || true
          go mod tidy
          go mod download

      - name: Build
        run: go build -v ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2

          args: --no-config --timeout=5m
        env:
          CGO_ENABLED: 0
          GOFLAGS: "-mod=mod"
          GOPROXY: "https://proxy.golang.org,direct"

      - name: Run tests
        run: go test -race -v ./...
